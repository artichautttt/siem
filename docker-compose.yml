services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=5000
      - DB_PATH=/app/data/siem.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200}
      - API_KEY=${API_KEY:-change-me}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
