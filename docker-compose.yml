services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-minisiem}
      - POSTGRES_USER=${POSTGRES_USER:-minisiem}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-minisiem}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minisiem} -d ${POSTGRES_DB:-minisiem}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-minisiem}
      - POSTGRES_USER=${POSTGRES_USER:-minisiem}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-minisiem}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200}
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt-secret}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      # Wazuh tourne dans des conteneurs séparés (voir wazuh-docker/single-node),
      # non gérés par ce compose : host.docker.internal permet au backend de
      # joindre le Wazuh Indexer exposé sur l'hôte (port 9200).
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL:-https://host.docker.internal:9200}
      - WAZUH_USER=${WAZUH_USER:-admin}
      - WAZUH_PASSWORD=${WAZUH_PASSWORD:-SecretPassword}
      - WAZUH_VERIFY_SSL=${WAZUH_VERIFY_SSL:-False}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
