apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: minisiem-frontend:k8s
          imagePullPolicy: IfNotPresent
          env:
            # Le "resolver" nginx (voir frontend/nginx.conf.template) ne suit
            # pas les domaines de recherche de /etc/resolv.conf comme le fait
            # la résolution système classique : il faut le FQDN complet du
            # Service pour que CoreDNS le résolve ("backend" seul échoue avec
            # "could not be resolved", testé en pratique). Le nom court reste
            # la valeur par défaut du Dockerfile pour docker-compose (Docker
            # résout les noms de service courts nativement).
            - name: BACKEND_HOST
              value: "backend.default.svc.cluster.local:5000"
          ports:
            - containerPort: 8080
          # nginx-unprivileged (UID 101) : écrit sa conf générée et ses caches
          # dans son système de fichiers, donc pas de readOnlyRootFilesystem.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
