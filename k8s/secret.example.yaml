# Modèle de Secret Kubernetes — NE PAS committer de vraies valeurs.
# Copier ce fichier en secret.yaml (ignoré par git, voir .gitignore) et
# remplacer les valeurs, ou créer le Secret directement en ligne de commande :
#   kubectl create secret generic mini-siem-secret \
#     --from-literal=JWT_SECRET=<valeur> \
#     --from-literal=ADMIN_PASSWORD=<valeur> \
#     --from-literal=WAZUH_PASSWORD=<valeur> \
#     --from-literal=POSTGRES_PASSWORD=<valeur>
apiVersion: v1
kind: Secret
metadata:
  name: mini-siem-secret
type: Opaque
stringData:
  JWT_SECRET: "change-me"
  ADMIN_PASSWORD: "change-me"
  WAZUH_PASSWORD: "change-me"
  POSTGRES_PASSWORD: "change-me"
