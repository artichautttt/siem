# Récepteur de démonstration pour les webhooks Alertmanager : loggue chaque
# requête reçue (visible via `kubectl logs`), pour prouver que les alertes
# "firing" déclenchent bien une notification sortante réelle. À remplacer par
# un vrai récepteur (email/Slack/PagerDuty) en usage réel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-sink
  template:
    metadata:
      labels:
        app: alert-sink
    spec:
      containers:
        - name: alert-sink
          image: mendhak/http-https-echo:31
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
spec:
  selector:
    app: alert-sink
  ports:
    - port: 8080
      targetPort: 8080
