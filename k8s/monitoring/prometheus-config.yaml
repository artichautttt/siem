apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Le backend Flask expose ses métriques sur /metrics (voir
      # backend/metrics.py) : port 5000, Service Kubernetes "backend".
      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:5000"]

  rules.yml: |
    groups:
      - name: mini-siem
        rules:
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Backend Mini-SIEM inaccessible"
              description: "Prometheus n'a pas pu scraper le backend (job=backend) depuis 30s."

          - alert: HighCriticalAlertRate
            expr: increase(alerts_generated_total{severity="CRITICAL"}[5m]) > 3
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Pic d'alertes CRITICAL"
              description: "Plus de 3 alertes CRITICAL générées par le moteur de détection sur les 5 dernières minutes."
