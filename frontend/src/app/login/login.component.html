<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a;">
  <form (ngSubmit)="submit()" style="background: #1e293b; padding: 32px; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    <h1 style="color: #f1f5f9; font-size: 20px; margin: 0 0 24px;">Mini-SIEM — Connexion</h1>

    <label style="display: block; color: #94a3b8; font-size: 13px; margin-bottom: 4px;">Utilisateur</label>
    <input
      name="username"
      [(ngModel)]="username"
      required
      style="width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 16px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9;"
    />

    <label style="display: block; color: #94a3b8; font-size: 13px; margin-bottom: 4px;">Mot de passe</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      required
      style="width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 16px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9;"
    />

    @if (error) {
      <div style="color: #ef4444; font-size: 13px; margin-bottom: 16px;">{{ error }}</div>
    }

    <button
      type="submit"
      [disabled]="loading || !username || !password"
      style="width: 100%; padding: 10px; border-radius: 6px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer;"
    >
      @if (loading) { Connexion... } @else { Se connecter }
    </button>
  </form>
</div>
