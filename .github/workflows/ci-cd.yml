name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minisiem
          POSTGRES_USER: minisiem
          POSTGRES_PASSWORD: minisiem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minisiem -d minisiem"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: minisiem
          POSTGRES_USER: minisiem
          POSTGRES_PASSWORD: minisiem
        run: pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npx ng test --no-watch

  # Scan de sécurité (Trivy) : dépendances Python/npm (CVE) et configuration
  # Terraform/Kubernetes/Dockerfiles (misconfigurations). Volontairement hors
  # de `needs` du job deploy et avec exit-code 0 : l'état actuel du dépôt a
  # des findings connus (voir README, section Scan de sécurité), ce job les
  # rend visibles sans bloquer les déploiements. Passer exit-code à '1' pour
  # en faire un garde-fou bloquant une fois les findings HIGH/CRITICAL traités.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — vulnérabilités des dépendances et secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          skip-dirs: frontend/node_modules
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Trivy — misconfigurations (Terraform, Kubernetes, Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          skip-dirs: frontend/node_modules
          severity: CRITICAL,HIGH
          exit-code: "0"

  deploy:
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose up -d --build --remove-orphans
            sudo docker image prune -f
